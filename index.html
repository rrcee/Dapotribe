<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAPO TRIBE | Style Reference: Fluz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Colors from Fluz Style Guide */
            --color-money-max-black: #1a0000;
            --color-sky-blue: #98bbf4;
            --color-canvas-white: #ffffff;
            --color-mist-gray: #f2f2f2;
            --color-light-cloud: #ededec;
            --color-subtle-ash: #514f4c;
            --gradient-hero: linear-gradient(90deg, rgb(130, 190, 255), rgb(166, 180, 247) 47.21%, rgb(91, 184, 154) 73.75%, rgb(33, 186, 76) 91.26%);

            /* Typography Scale */
            --font-display: 'Bebas Neue', sans-serif; /* Greed Condensed Substitute */
            --font-body: 'Inter', sans-serif; /* Area Semibold Substitute */

            /* Spacing & Shapes */
            --section-gap: 40px;
            --card-radius: 20px;
            --button-radius: 200px;
            --page-max-width: 1750px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--color-canvas-white);
            color: var(--color-money-max-black);
            font-family: var(--font-body);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* Hero Section */
        .hero {
            background: var(--gradient-hero);
            padding: 120px 20px;
            text-align: center;
            margin-bottom: var(--section-gap);
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(80px, 15vw, 180px);
            line-height: 0.85;
            letter-spacing: -0.025em;
            color: var(--color-money-max-black);
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 20px;
            font-weight: 700;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        /* Buttons */
        .btn-primary {
            display: inline-block;
            background-color: var(--color-money-max-black);
            color: var(--color-canvas-white);
            padding: 16px 32px;
            border-radius: var(--button-radius);
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        /* Product Grid */
        .container {
            max-width: var(--page-max-width);
            margin: 0 auto;
            padding: 0 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: var(--section-gap);
        }

        /* Fluz Product Display Card */
        .card {
            background: transparent;
            border-radius: 0;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-image-wrapper {
            width: 100%;
            aspect-ratio: 9 / 16;
            background-color: var(--color-mist-gray);
            border-radius: var(--card-radius);
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stock-badge {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--color-subtle-ash);
            letter-spacing: 0.05em;
        }

        .order-link {
            display: block;
            margin-top: 8px;
            font-weight: 700;
            color: var(--color-money-max-black);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Footer */
        footer {
            padding: 80px 20px;
            text-align: center;
            border-top: 1px solid var(--color-light-cloud);
            margin-top: var(--section-gap);
        }

        footer p {
            font-size: 14px;
            color: var(--color-subtle-ash);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 80px; }
            .container { padding: 0 20px; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container">
            <h1>Dapo<br>Tribe</h1>
            <p>Vivid psychedelic structures for the bold. High-quality star drops on max.</p>
            <a href="https://www.instagram.com/m/saahall___" class="btn-primary">DM to Order</a>
        </div>
    </section>

    <main class="container">
        <div class="grid">
            <article class="card">
                <div class="card-image-wrapper">
                    <img src="checker-vortex.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-badge">Stock: Low</div>
                <a href="https://www.instagram.com/m/saahall___" class="order-link">Inquire via Instagram</a>
            </article>

            <article class="card">
                <div class="card-image-wrapper">
                    <img src="creature-spiral.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-badge">Stock: Medium</div>
                <a href="https://www.instagram.com/m/saahall___" class="order-link">Inquire via Instagram</a>
            </article>

            <article class="card">
                <div class="card-image-wrapper">
                    <img src="mandala-purple.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-badge">Stock: Very Low</div>
                <a href="https://www.instagram.com/m/saahall___" class="order-link">Inquire via Instagram</a>
            </article>

            <article class="card">
                <div class="card-image-wrapper">
                    <img src="neon-splatter.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-badge">Stock: Sold Out</div>
                <a href="https://www.instagram.com/m/saahall___" class="order-link">View Collection</a>
            </article>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 DAPO TRIBE — Limited Drops Only</p>
            <p style="margin-top: 10px; font-weight: 700;">@saahall___</p>
        </div>
    </footer>

</body>
</html>
