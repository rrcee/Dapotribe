<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAPO TRIBE | Crazy Affordable Collection</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-money-max-black: #0d0d0d;
            --color-canvas-white: #fafafa;
            --color-mist-gray: #f4f4f6;
            --color-sky-blue: #a3c4f3;
            --color-subtle-ash: #6c6c72;
            
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
            --page-max: 1440px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--color-canvas-white);
            color: var(--color-money-max-black);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HARDWARE ACCELERATED BACKGROUND --- */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #fcfcfc, #ebebeb);
        }

        .blob {
            position: absolute;
            width: 650px;
            height: 650px;
            background: var(--color-sky-blue);
            filter: blur(140px);
            border-radius: 50%;
            opacity: 0.35;
            will-change: transform;
            pointer-events: none;
        }

        /* --- PERFORMANCE OPTIMIZED CURSOR --- */
        .custom-cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--color-money-max-black);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        .custom-cursor-ring {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(13, 13, 13, 0.2);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Hide native cursor only on desktop devices that support hover mechanics */
        @media (hover: hover) and (pointer: fine) {
            body, a, button, .card {
                cursor: none;
            }
        }
        @media (max-width: 1024px) {
            .custom-cursor-dot, .custom-cursor-ring { display: none; }
        }

        /* --- HERO --- */
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(100px, 20vw, 260px);
            line-height: 0.8;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
            opacity: 0;
        }

        .hero p {
            font-weight: 700; 
            color: var(--color-subtle-ash);
            letter-spacing: 0.15em;
            font-size: 14px;
            text-transform: uppercase;
            opacity: 0;
        }

        .hero .btn-pill {
            margin-top: 40px;
            opacity: 0;
        }

        /* --- 3D PRODUCT CARDS --- */
        .container {
            max-width: var(--page-max);
            margin: 0 auto;
            padding: 0 40px 120px 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            perspective: 1200px; /* Essential framework for parent grid 3D space */
        }

        .card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            
            /* Enable absolute 3D rendering context */
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Interactive Dynamic Lighting Sheen Panel */
        .card-sheen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: overlay;
            border-radius: 28px;
        }

        .card-image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            position: relative;
            transform-style: preserve-3d;
        }

        .card-image-container img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.06));
            
            /* High structural Z-pop away from glass base layer */
            transform: translateZ(50px);
            will-change: transform;
            transition: filter 0.3s ease;
        }

        .card:hover .card-image-container img {
            filter: drop-shadow(0 25px 45px rgba(0,0,0,0.12));
        }

        /* --- CARD ACCENTS --- */
        .stock-tag {
            font-family: var(--font-display);
            font-size: 26px;
            color: var(--color-money-max-black);
            margin-bottom: 24px;
            opacity: 0.8;
            letter-spacing: 0.03em;
            transform: translateZ(30px);
        }

        .btn-pill {
            display: inline-block;
            background-color: var(--color-money-max-black);
            color: var(--color-canvas-white);
            padding: 16px 42px;
            border-radius: 200px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.08em;
            width: 100%;
            max-width: 200px;
            transform: translateZ(40px);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- COMPONENT STATES --- */
        .card.archived {
            opacity: 0.35 !important;
        }
        
        .card.archived .btn-pill {
            background-color: transparent;
            border: 1px solid var(--color-money-max-black);
            color: var(--color-money-max-black);
            pointer-events: none;
        }

        footer {
            padding: 80px 40px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 18px;
            letter-spacing: 0.15em;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <!-- Target Anchors for Custom Cursor Manipulation -->
    <div class="custom-cursor-dot"></div>
    <div class="custom-cursor-ring"></div>

    <div class="parallax-bg">
        <div class="blob" id="blob-1" style="top: -10%; left: -10%;"></div>
        <div class="blob" id="blob-2" style="bottom: -10%; right: -10%; background: #5bb89a;"></div>
    </div>

    <header class="hero">
        <h1 id="hero-title">DAPO<br>TRIBE</h1>
        <p id="hero-subtitle">Premium Psychedelic Structures</p>
        <a href="https://www.instagram.com/m/saahall___" class="btn-pill" id="hero-btn">Enter The Tribe</a>
    </header>

    <main class="container">
        <div class="grid">
            <div class="card">
                <div class="card-sheen"></div>
                <div class="card-image-container">
                    <img src="checker-vortex.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Limited Stock</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Acquire</a>
            </div>

            <div class="card">
                <div class="card-sheen"></div>
                <div class="card-image-container">
                    <img src="creature-spiral.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Current Drop</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Acquire</a>
            </div>

            <div class="card">
                <div class="card-sheen"></div>
                <div class="card-image-container">
                    <img src="mandala-purple.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Vault Series</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Acquire</a>
            </div>

            <div class="card archived">
                <div class="card-sheen"></div>
                <div class="card-image-container">
                    <img src="neon-splatter.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Sold Out</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Archived</a>
            </div>
        </div>
    </main>

    <footer>
        <p>EST. 2026 — DAPO TRIBE — @saahall___</p>
    </footer>

    <!-- GSAP Framework Base -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            
            /* ==========================================================================
               1. INTRO / ENTRANCE TIMELINE
               ========================================================================== */
            const tl = gsap.timeline({ defaults: { ease: "power4.out" } });
            
            tl.to("#hero-title", { opacity: 1, y: 0, duration: 1.4, startAt: { y: 60 } })
              .to("#hero-subtitle", { opacity: 1, y: 0, duration: 1, startAt: { y: 20 } }, "-=1.0")
              .to("#hero-btn", { opacity: 1, y: 0, duration: 1, startAt: { y: 20 } }, "-=0.8")
              .to(".card", { 
                  opacity: (index, target) => target.classList.contains('archived') ? 0.35 : 1, 
                  y: 0, 
                  stagger: 0.12, 
                  duration: 1.2, 
                  startAt: { y: 60 } 
              }, "-=0.6");


            /* ==========================================================================
               2. HIGH-PERFORMANCE CUSTOM CURSOR TRAIL
               ========================================================================== */
            const dot = document.querySelector('.custom-cursor-dot');
            const ring = document.querySelector('.custom-cursor-ring');
            
            // Allocate fast-caching GSAP quick setters for continuous frame tracking
            const setDotX = gsap.quickTo(dot, "x", { duration: 0.08, ease: "power3.out" });
            const setDotY = gsap.quickTo(dot, "y", { duration: 0.08, ease: "power3.out" });
            const setRingX = gsap.quickTo(ring, "x", { duration: 0.25, ease: "power2.out" });
            const setRingY = gsap.quickTo(ring, "y", { duration: 0.25, ease: "power2.out" });

            window.addEventListener('mousemove', (e) => {
                setDotX(e.clientX);
                setDotY(e.clientY);
                setRingX(e.clientX);
                setRingY(e.clientY);

                // Fluid background decorative blob tracking mechanics
                const targetX = (e.clientX - window.innerWidth / 2) * 0.05;
                const targetY = (e.clientY - window.innerHeight / 2) * 0.05;
                gsap.to("#blob-1", { x: targetX, y: targetY, duration: 2, ease: "power2.out" });
                gsap.to("#blob-2", { x: -targetX, y: -targetY, duration: 2, ease: "power2.out" });
            });

            // Interactive Cursor Expansion Target Rules
            const interactiveSelectors = document.querySelectorAll('a, .card, .btn-pill');
            interactiveSelectors.forEach(element => {
                element.addEventListener('mouseenter', () => {
                    ring.style.width = '65px';
                    ring.style.height = '65px';
                    ring.style.backgroundColor = 'rgba(13, 13, 13, 0.03)';
                    ring.style.borderColor = 'rgba(13, 13, 13, 0.6)';
                });
                element.addEventListener('mouseleave', () => {
                    ring.style.width = '40px';
                    ring.style.height = '40px';
                    ring.style.backgroundColor = 'transparent';
                    ring.style.borderColor = 'rgba(13, 13, 13, 0.2)';
                });
            });


            /* ==========================================================================
               3. ADVANCED 3D SPATIAL TILT & DYNAMIC LIGHT MAPPING
               ========================================================================== */
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const sheen = card.querySelector('.card-sheen');
                
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    // Identify center offset coordinates
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const deltaX = x - centerX;
                    const deltaY = y - centerY;
                    
                    // Convert offsets into balanced perspective angles
                    const rotationX = -(deltaY / centerY) * 12; // Maximum tilt: 12deg
                    const rotationY = (deltaX / centerX) * 12;
                    
                    gsap.to(card, {
                        rotateX: rotationX,
                        rotateY: rotationY,
                        transformPerspective: 1000,
                        scale: 1.02,
                        background: "rgba(255, 255, 255, 0.7)",
                        boxShadow: "0 35px 70px rgba(0, 0, 0, 0.06)",
                        duration: 0.3,
                        ease: "power2.out"
                    });

                    // Map structural light sheen coordinates dynamically
                    if (sheen) {
                        const sheenPercentageX = (x / rect.width) * 100;
                        const sheenPercentageY = (y / rect.height) * 100;
                        gsap.to(sheen, {
                            background: `radial-gradient(circle at ${sheenPercentageX}% ${sheenPercentageY}%, rgba(255,255,255,0.45) 0%, transparent 65%)`,
                            duration: 0.2
                        });
                    }
                });

                card.addEventListener('mouseleave', () => {
                    // Smoothly ease standard defaults back into layout stream
                    gsap.to(card, {
                        rotateX: 0,
                        rotateY: 0,
                        scale: 1,
                        background: "rgba(255, 255, 255, 0.45)",
                        boxShadow: "0 0px 0px rgba(0, 0, 0, 0)",
                        duration: 0.7,
                        ease: "power3.out"
                    });

                    if (sheen) {
                        gsap.to(sheen, {
                            background: "radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0%, transparent 60%)",
                            duration: 0.6,
                            ease: "power3.out"
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
