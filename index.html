<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAPO TRIBE | Luxury Collection</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Fluz Style Tokens */
            --color-money-max-black: #1a0000;
            --color-canvas-white: #ffffff;
            --color-mist-gray: #f2f2f2;
            --color-sky-blue: #98bbf4;
            --gradient-hero: linear-gradient(90deg, #82befe, #a6b4f7, #5bb89a, #21ba4c);
            
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
            --page-max: 1750px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--color-canvas-white);
            color: var(--color-money-max-black);
            font-family: var(--font-body);
            overflow-x: hidden;
            background: #fff;
        }

        /* --- CINEMATIC PARALLAX BACKGROUND --- */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #f9f9f9, #ededec);
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: var(--color-sky-blue);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.4;
            animation: drift 20s infinite alternate ease-in-out;
        }

        @keyframes drift {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(20%, 15%) scale(1.2); }
        }

        /* --- ENTRANCE GLARE --- */
        body::after {
            content: "";
            position: fixed;
            top: -150%;
            left: -150%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.8) 50%, transparent 55%);
            z-index: 9999;
            pointer-events: none;
            animation: initialGlare 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes initialGlare {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50%, 50%); }
        }

        /* --- TYPOGRAPHY ANIMATION --- */
        @keyframes textReveal {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HERO --- */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(100px, 18vw, 240px);
            line-height: 0.8;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            animation: textReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- PRODUCT CARDS (GLASSMORPISM) --- */
        .container {
            max-width: var(--page-max);
            margin: 0 auto;
            padding: 80px 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px; /* Fluz Style Radius */
            padding: 30px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.8);
        }

        .card-image-container {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .card-image-container img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain; /* No cropping */
            animation: starSpin 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }

        @keyframes starSpin {
            0% { transform: rotate(-180deg) scale(0.5); opacity: 0; }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        /* --- STOCK & CTA --- */
        .stock-tag {
            font-family: var(--font-display);
            font-size: 24px;
            color: var(--color-money-max-black);
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .btn-pill {
            display: inline-block;
            background-color: var(--color-money-max-black);
            color: var(--color-canvas-white);
            padding: 18px 48px;
            border-radius: 200px; /* Pill shape required */
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .btn-pill:hover {
            background-color: #330000;
            box-shadow: 0 10px 30px rgba(26, 0, 0, 0.2);
        }

        footer {
            padding: 100px 40px;
            text-align: center;
            font-family: var(--font-display);
            letter-spacing: 0.2em;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="parallax-bg">
        <div class="blob" style="top: 10%; left: 10%;"></div>
        <div class="blob" style="bottom: 10%; right: 10%; background: #5bb89a;"></div>
    </div>

    <header class="hero">
        <h1>DAPO<br>TRIBE</h1>
        <p style="font-weight: 700; color: var(--color-subtle-ash);">PREMIUM PSYCHEDELIC STRUCTURES</p>
        <a href="https://www.instagram.com/m/saahall___" class="btn-pill" style="margin-top: 40px;">Enter The Tribe</a>
    </header>

    <main class="container">
        <div class="grid">
            <div class="card">
                <div class="card-image-container">
                    <img src="checker-vortex.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Limited Stock</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Acquire</a>
            </div>

            <div class="card">
                <div class="card-image-container">
                    <img src="creature-spiral.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Current Drop</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Acquire</a>
            </div>

            <div class="card">
                <div class="card-image-container">
                    <img src="mandala-purple.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Vault Series</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill">Acquire</a>
            </div>

            <div class="card">
                <div class="card-image-container">
                    <img src="neon-splatter.webp" alt="Dapo Star Pattern">
                </div>
                <div class="stock-tag">Sold Out</div>
                <a href="https://www.instagram.com/m/saahall___" class="btn-pill" style="opacity: 0.5; pointer-events: none;">Archived</a>
            </div>
        </div>
    </main>

    <footer>
        <p>EST. 2026 — DAPO TRIBE — @saahall___</p>
    </footer>

    <script>
        // Subtle Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blob');
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;

            blobs.forEach(blob => {
                blob.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
